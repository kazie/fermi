name: Dependabot auto-merge

# Patch and minor updates merge by themselves once the required `ci-ok` check passes
# (needs "Allow auto-merge" + branch protection on master; see README). Majors wait for a human, and so does
# FerMEANie's voice-engine group whatever its version: it changes how she sounds, so someone listens first
# (content/VOICE.md, Dependencies).

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'kazie/fermi'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch and minor updates (not her voice engine)
        if: >-
          steps.meta.outputs.dependency-group != 'voice-engine' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

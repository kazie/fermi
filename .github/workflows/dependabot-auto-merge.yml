name: Dependabot auto-merge

# Patch and minor updates, and flake.lock bumps (no semver type), merge by themselves (merge commit) once the
# required checks pass (`ci-ok` and Nix's `devshell`; needs "Allow auto-merge" + branch protection on master; see
# README). Majors are assigned to the repo owner, and so is FerMEANie's voice-engine group whatever its version: it
# changes how she sounds, so someone listens first (content/VOICE.md, Dependencies). The assignment is the
# notification that a person is needed; dependabot-attention.yml does the same when a check fails.

on: pull_request

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'kazie/fermi'
    runs-on: ubuntu-latest
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - id: auto
        name: Enable auto-merge for patch, minor and nix updates (not her voice engine)
        if: >-
          steps.meta.outputs.dependency-group != 'voice-engine' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.package-ecosystem == 'nix')
        run: gh pr merge --auto --merge "$PR_URL"
      - name: Assign the owner (needs a person)
        if: steps.auto.outcome == 'skipped'
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" -f "assignees[]=$OWNER" --silent

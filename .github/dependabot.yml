version: 2
updates:
  # The whole pnpm workspace (root lockfile covers apps/* and packages/*). All minor and patch bumps come in one PR:
  # master doesn't require PRs to be up to date before merging (so the weekly PRs merge without anyone updating
  # them), and one npm PR means no two Dependabot PRs edit pnpm-lock.yaml. Majors still come one PR each.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  # FerMEANie's voice worker (apps/server/voice/uv.lock). Monthly; the packages that shape how she sounds come in one
  # PR of their own: listen before merging (play a game, or audition), as merging re-renders every clip.
  - package-ecosystem: uv
    directory: /apps/server/voice
    schedule:
      interval: monthly
    labels: [dependencies, voice]
    groups:
      voice-engine:
        patterns: [kokoro-onnx, onnxruntime*, espeakng-loader]
      python:
        patterns: ['*']

  # The Nix dev shell's nixpkgs (flake.lock). Weekly, with the npm bumps, so Nix's Playwright browsers keep up with
  # @playwright/test. Merges by itself once Nix's devshell check (nix.yml) has built the dev shell.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The Node major is a deliberate choice (engines >=26); bump it by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]

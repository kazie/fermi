version: 2
updates:
  # The whole pnpm workspace (root lockfile covers apps/* and packages/*)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  # FerMEANie's voice worker (apps/server/voice/uv.lock). Monthly; the packages that shape how she sounds come in one
  # PR of their own: listen before merging (play a game, or audition), as merging re-renders every clip.
  - package-ecosystem: uv
    directory: /apps/server/voice
    schedule:
      interval: monthly
    labels: [dependencies, voice]
    groups:
      voice-engine:
        patterns: [kokoro-onnx, onnxruntime*, espeakng-loader, phonemizer-fork]
      python:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The Node major is a deliberate choice (engines >=24.2); bump it by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
